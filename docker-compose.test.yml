services:
  test-db:
    image: postgres:16-alpine
    container_name: finance_test_db
    environment:
      POSTGRES_USER: finance_test
      POSTGRES_PASSWORD: finance_test_secret
      POSTGRES_DB: finance_test_db
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance_test"]
      interval: 2s
      timeout: 2s
      retries: 10

  test-mcp:
    build: .
    container_name: finance_test_mcp
    depends_on:
      test-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://finance_test:finance_test_secret@test-db:5432/finance_test_db
      MCP_TRANSPORT: streamable_http
      MCP_PORT: "8000"

  test-runner:
    build: .
    container_name: finance_test_runner
    depends_on:
      test-mcp:
        condition: service_started
    entrypoint: ["python", "/tests/test_mcp.py"]
    volumes:
      - ./test_mcp.py:/tests/test_mcp.py:ro
    environment:
      MCP_TEST_URL: http://test-mcp:8000/mcp
